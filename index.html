
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forked Up</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: white;
    color: #222;
    text-align: center;
    user-select: none;
}

.star-hud {
    position: fixed;
    top: 14px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    z-index: 100;
}

.star-box {
    background: rgba(255,255,255,.96);
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 7px 11px;
    font-size: 14px;
    line-height: 1.25;
    box-shadow: 0 2px 7px rgba(0,0,0,.08);
    text-align: left;
}

.star-box.total { text-align: right; }
.star-title { font-size: 11px; color: #777; margin-bottom: 1px; }
.star-value { font-weight: bold; white-space: nowrap; }

@media (max-width: 600px) {
    .star-hud { top: 8px; left: 8px; right: 8px; }
    .star-box { padding: 6px 9px; font-size: 13px; }
    .star-title { font-size: 10px; }
}

h1 { margin: 0 0 5px; font-size: 28px; }
.subtitle { margin-bottom: 12px; color: #666; font-size: 15px; }
.mode-picker { margin: 0 auto 18px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
.mode-button { border:1px solid #ccc; border-radius:9px; padding:9px 14px; background:#fff; cursor:pointer; font-weight:600; }
.mode-button.active { background:#222; color:#fff; border-color:#222; }
.capture-counts { display:none; width:104px; flex:0 0 104px; margin:0; gap:10px; flex-direction:column; justify-content:center; align-items:stretch; }
.capture-count { display:flex; align-items:center; justify-content:center; gap:8px; border:1px solid #ddd; border-radius:8px; padding:8px 10px; background:#fafafa; font-size:16px; cursor:pointer; user-select:none; transition:border-color .12s, background .12s, box-shadow .12s; }
.capture-count.selected { border-color:#333; background:#f0f0f0; box-shadow:0 0 0 2px #3332; }
.capture-count:focus-visible { outline:2px solid #333; outline-offset:2px; }
body.capture-mode .cell .piece { width:58%; height:58%; }
.capture-count img { width:25px; height:25px; object-fit:contain; }
.capture-board-area { display:flex; align-items:center; justify-content:center; gap:24px; width:fit-content; max-width:100%; margin:0 auto; }
.capture-layout { display:none; width:min(1120px, 100%); margin:30px auto 0; }
.loop-grid { display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(4, 1fr); gap:2px; width:clamp(185px, 19vw, 235px); aspect-ratio:1; position:relative; margin:0 auto; }
.loop-cell { border:1px solid #d9d9d9; background:#fbfbfb; color:#888; font-size:11px; display:flex; align-items:center; justify-content:center; min-width:0; }
.loop-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.loop-lines line { stroke:#333; stroke-width:2.4; stroke-linecap:round; }
.loop-card { border:1px solid #e2e2e2; border-radius:14px; padding:16px; background:#fff; }
.loop-card h3 { margin:0 0 12px; font-size:15px; }
.loop-card p { margin:10px 0 0; font-size:12px; color:#666; }
.loop-cards { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:22px 26px; align-items:start; }
.capture-note { color:#666; font-size:13px; margin:0 auto 16px; max-width:720px; }
body.capture-mode .capture-board-area { gap:24px; }
body.capture-mode .board { gap:4px; }
body.capture-mode .cell { cursor:pointer; }
@media (max-width:850px) { .loop-cards { grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } .loop-grid { width:clamp(165px, 28vw, 220px); } }
@media (max-width:600px) { .capture-board-area { flex-direction:column; gap:10px; width:100%; } .capture-counts { width:100%; flex-basis:auto; flex-direction:row; flex-wrap:wrap; gap:6px; } .capture-count { padding:6px 8px; gap:4px; font-size:13px; } .capture-count img { width:20px; height:20px; } .loop-cards { grid-template-columns:1fr; gap:14px; } .loop-grid { width:min(100%, 240px); } .loop-card { padding:12px; } .loop-card h3 { font-size:13px; } }

.colors {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
}

.color-button {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 2px solid transparent;
    cursor: pointer;
}

.color-button.selected {
    border-color: #222;
    box-shadow: 0 0 0 2px white, 0 0 0 4px #222;
}

.green { background: #cfe6d0; }
.blue { background: #cbdcf2; }
.yellow { background: #f5e9ad; }
.orange { background: #f5d1b0; }

.tools {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-bottom: 18px;
}

.tool-button {
    width: 44px;
    height: 38px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.tool-button.selected {
    border-color: #222;
    background: #f1f1f1;
    box-shadow: inset 0 0 0 2px #222;
}

.board-wrapper {
    position: relative;
    width: fit-content;
    margin: 0 auto;
}

.board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, clamp(64px, 18vw, 112px));
    grid-template-rows: repeat(4, clamp(64px, 18vw, 112px));
    gap: 4px;
}

.cell {
    position: relative;
    z-index: 1;
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: visible;
}

.cell:hover { border-color: #aaa; }

.piece {
    width: 62%;
    height: 62%;
    object-fit: contain;
    pointer-events: none;
    position: relative;
    z-index: 2;
}

.markers {
    position: absolute;
    top: 5px;
    left: 5px;
    display: flex;
    gap: 3px;
    pointer-events: none;
    z-index: 5;
}

.marker {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid currentColor;
}

.marker.filled { background: currentColor; }

.marker.cross {
    width: 16px;
    height: 16px;
    border: none;
    border-radius: 0;
    position: relative;
}

.marker.cross::before,
.marker.cross::after {
    content: "";
    position: absolute;
    left: 7px;
    top: 0;
    width: 3px;
    height: 18px;
    background: currentColor;
    border-radius: 2px;
}

.marker.cross::before { transform: rotate(45deg); }
.marker.cross::after { transform: rotate(-45deg); }

.corner-slash {
    position: absolute;
    right: 6px;
    bottom: 6px;
    width: 20px;
    height: 3px;
    background: #222;
    transform: rotate(-45deg);
    transform-origin: center;
    pointer-events: none;
    z-index: 50;
    display: block;
    border-radius: 2px;
}

.corner-slash.white-slash { background: #aaa; }

.arrow-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 20;
}

.arrow {
    fill: none;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.bottom-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.bottom-button {
    padding: 8px 15px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.bottom-button:hover { background: #f3f3f3; }

.submit-button {
    padding: 8px 18px;
    border: 1px solid #ccc;
    background: #222;
    color: white;
    border-radius: 7px;
    cursor: pointer;
    font-size: 14px;
}

.submit-button:hover { background: #444; }
.submit-button:disabled { opacity: .5; cursor: default; }
.max-candies{margin-top:2px;font-size:13px;color:#9d8a6a;}

.result-message {
    min-height: 20px;
    margin-top: 12px;
    font-size: 15px;
    color: #666;
}

.board.locked .cell {
    background: var(--solved-cell, #e8dcc5);
    cursor: default;
}

.board.locked .cell:hover { border-color: #ddd; }

.board.locked::after {
    content: "✓";
    position: absolute;
    top: -13px;
    right: -13px;
    z-index: 40;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: #222;
    background: #c9b89b;
    border: 2px solid #222;
    font-size: 23px;
    font-weight: bold;
    line-height: 1;
    box-shadow: 0 2px 5px rgba(0,0,0,.18);
    animation: checkmark-pop .42s cubic-bezier(.2,1.6,.4,1) both;
    pointer-events: none;
}

@keyframes checkmark-pop {
    0% { transform: scale(0) rotate(-25deg); opacity: 0; }
    75% { transform: scale(1.15) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
}

.star-fly {
    position: fixed;
    z-index: 9999;
    pointer-events: none;
    font-size: 27px;
    line-height: 1;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.2));
    will-change: transform, opacity;
}

.total-stars-pop { animation: total-stars-pop .45s ease-out; }

@keyframes total-stars-pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.35); color: #a87813; }
    100% { transform: scale(1); }
}

@media (prefers-reduced-motion: reduce) {
    .board.locked::after, .total-stars-pop { animation: none; }
}

.end-message {
    display: none;
    margin-top: 18px;
    font-size: 15px;
    color: #666;
}

/* BiShop */
#shopButton { font-weight: bold; border-color: #b88a36; background: #fff7df; }
#shopButton:hover { background: #ffedb5; }
.shop-overlay { position:fixed; inset:0; z-index:1000; display:none; align-items:center; justify-content:center; padding:18px; background:rgba(20,24,35,.58); }
.shop-overlay.open { display:flex; }
.shop-panel { width:min(720px,100%); max-height:min(86vh,800px); overflow:auto; background:#fffdf7; color:#242424; border:2px solid #e4c36f; border-radius:18px; padding:20px; box-shadow:0 18px 60px #0004; text-align:left; }
.shop-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.shop-head h2 { margin:0; font-size:25px; }
.shop-close { border:0; border-radius:8px; background:#eee; padding:7px 11px; cursor:pointer; font-size:18px; }
.shop-balance { margin:10px 0 16px; padding:10px 12px; border-radius:10px; background:#fff1c9; font-weight:bold; }
.shop-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.shop-tab { border:1px solid #ddd; border-radius:9px; padding:8px 12px; background:white; cursor:pointer; }
.shop-tab.active { background:#292d3e; color:white; border-color:#292d3e; }
.shop-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.shop-item { border:1px solid #e5dfd1; background:white; border-radius:12px; padding:13px; }
.shop-preview { height:65px; border-radius:8px; margin-bottom:10px; border:1px solid #ddd; background:repeating-linear-gradient(135deg,#f5ead5 0 8px,#fffaf0 8px 16px); }
.shop-item h3 { margin:4px 0 5px; font-size:16px; }
.shop-item p { margin:0 0 11px; color:#666; font-size:13px; line-height:1.4; }
.shop-buy { width:100%; border:0; border-radius:8px; padding:9px; cursor:pointer; background:#292d3e; color:white; font-weight:bold; }
.shop-buy:disabled { background:#d9d9d9; color:#666; cursor:default; }
.shop-note { color:#777; font-size:12px; margin-top:12px; line-height:1.45; }
body.theme-default { background:#fff; }
:root { --empty-cell: #fafafa; --solved-cell: #e8dcc5; }
.custom-colors { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0; }
.custom-color-row { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; }
.custom-color-row input[type="color"] { width:42px; height:32px; border:1px solid #ddd; border-radius:6px; background:white; padding:2px; }
body.theme-ocean { background:repeating-linear-gradient(135deg,#e9f9fb 0 12px,#ccecf0 12px 24px); }
body.theme-sunset { background:repeating-linear-gradient(135deg,#fff0e5 0 12px,#fbd6c4 12px 24px); }
body.theme-forest { background:repeating-linear-gradient(135deg,#edf5e9 0 12px,#d4e7ce 12px 24px); }
body.theme-lavender { background:repeating-linear-gradient(135deg,#f5efff 0 12px,#e4d8fa 12px 24px); }
body.theme-custom { background-position:center; background-size:cover; background-attachment:fixed; background-repeat:no-repeat; }
body.theme-custom::before { content:""; position:fixed; inset:0; background:rgba(255,255,255,.42); pointer-events:none; z-index:-1; }
body.pulse-tiles .cell:hover { animation: tile-pulse .65s ease-in-out infinite alternate; }
@keyframes tile-pulse { from { box-shadow:0 0 0 0 rgba(100,120,180,0); } to { box-shadow:0 0 0 4px rgba(100,120,180,.35); } }
@media(max-width:520px) { .shop-panel { padding:15px; } .shop-head h2 { font-size:21px; } }


#confettiCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 9998;
}

</style>
</head>

<body>
<canvas id="confettiCanvas" aria-hidden="true"></canvas>

<div class="star-hud">
    <div class="star-box">
        <div class="star-title">Level</div>
        <div class="star-value" id="levelStars">⭐ 1</div>
    </div>
    <div class="star-box total">
        <div class="star-title">Total</div>
        <div class="star-value" id="totalStars">🍬 0</div>
        <div class="star-value max-candies" id="maxCandies">🟤 0</div>
    </div>
</div>

<h1>Forked Up</h1>
<div class="subtitle">Create groups of four!</div>
<div class="mode-picker" aria-label="Game mode">
    <button class="mode-button active" id="standardMode">Standard</button>
    <button class="mode-button" id="captureModeButton">Connect 5?</button>
</div>
<p class="capture-note" id="captureNote" style="display:none">Fill in the pieces using the 5 possible groups. Then solve it as a standard puzzle.</p>

<div class="colors">
    <button class="color-button green selected" data-color="green" aria-label="Green"></button>
    <button class="color-button blue" data-color="blue" aria-label="Blue"></button>
    <button class="color-button yellow" data-color="yellow" aria-label="Yellow"></button>
    <button class="color-button orange" data-color="orange" aria-label="Orange"></button>
</div>

<div class="tools">
    <button class="tool-button selected" data-tool="filled" title="Filled square">■</button>
    <button class="tool-button" data-tool="open" title="Open circle">○</button>
    <button class="tool-button" data-tool="closed" title="Closed circle">●</button>
    <button class="tool-button" data-tool="cross" title="Cross">×</button>
</div>

<div class="capture-board-area">
    <div class="capture-counts" id="captureCounts" aria-label="Piece counts">
        <div class="capture-count" data-piece="C" role="button" tabindex="0" aria-label="Select rook"><img src="https://lichess1.org/assets/piece/rhosgfx/wR.svg" alt="Rook"><b>7</b></div>
        <div class="capture-count" data-piece="A" role="button" tabindex="0" aria-label="Select knight"><img src="https://lichess1.org/assets/piece/rhosgfx/wN.svg" alt="Knight"><b>4</b></div>
        <div class="capture-count" data-piece="B" role="button" tabindex="0" aria-label="Select bishop"><img src="https://lichess1.org/assets/piece/rhosgfx/wB.svg" alt="Bishop"><b>3</b></div>
        <div class="capture-count" data-piece="D" role="button" tabindex="0" aria-label="Select pawn"><img src="https://lichess1.org/assets/piece/rhosgfx/wP.svg" alt="Pawn"><b>2</b></div>
    </div>
    <div class="board-wrapper">
    <div class="board" id="board">
        <svg id="arrowLayer" class="arrow-layer"
             xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    </div>
</div>
<div class="capture-layout" id="captureLayout">
    <div class="loop-cards" id="loopCards"></div>
</div>

<div class="bottom-buttons">
    <button class="bottom-button" id="previousPuzzle">← Previous</button>
    <button class="bottom-button" id="reset">Reset</button>
    <button class="bottom-button" id="nextPuzzle">Next puzzle →</button>
</div>

<div class="bottom-buttons">
    <button class="submit-button" id="submitPuzzle">Submit</button>
</div>
<div class="bottom-buttons">
    <button class="bottom-button" id="shopButton">♝ BiShop 🍬</button>
</div>

<div class="shop-overlay" id="shopOverlay" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
  <div class="shop-panel">
    <div class="shop-head"><h2 id="shopTitle">♝ BiShop</h2><button class="shop-close" id="shopClose" aria-label="Close shop">✕</button></div>
    <div class="shop-balance" id="shopBalance">🍬 0 snoepjes</div>
    <div class="shop-tabs" id="shopTabs">
      <button class="shop-tab active" data-shop-tab="themes">Themes</button>
      <button class="shop-tab" data-shop-tab="effects">Effects</button>
      <button class="shop-tab" data-shop-tab="custom">Custom</button>
    </div>
    <div class="shop-grid" id="shopGrid"></div>
  </div>
</div>
<input type="file" id="backgroundUpload" accept="image/*" hidden>

<div class="result-message" id="resultMessage"></div>
<div class="end-message" id="endMessage">You've reached the end.</div>

<script>
/* PUZZLES */

const puzzles = [
    ["A","B","C","C","D","C","D","B","B","A","A","A","D","D","C","B"],
    ["B","C","A","C","D","B","A","A","C","A","D","C","B","A","C","C"],
    ["A","A","C","C","C","C","D","B","B","C","D","C","A","A","B","C"],
    ["C","C","C","B","A","C","C","B","C","C","C","C","D","D","D","D"],
    ["B","C","C","C","A","D","A","C","C","B","D","A","A","D","C","C"],
    ["A","C","A","B","A","B","A","C","B","A","A","B","C","C","A","B"],
    ["C","A","A","B","A","B","B","A","A","B","B","A","B","A","A","C"],
    ["C","B","A","C","B","D","A","B","C","B","B","C","C","D","C","B"],
    ["C","C","A","A","A","B","D","C","A","D","D","C","C","B","C","B"],
    ["C","C","A","C","C","D","D","A","C","D","D","C","C","D","D","A"],
    ["B","B","B","B","B","B","B","B","B","B","B","B","B","B","B","B"]
];

const answers = [
    ["A","B","C","A","B","B","A","D","C","D","D","B","D","C","C","A"],
    ["A","B","B","B","B","C","A","D","C","D","C","C","D","A","D","A"],
    ["A","D","A","C","B","B","D","D","A","A","B","C","B","D","C","C"],
    ["A","B","C","B","A","C","C","C","A","B","D","D","B","A","D","D"],
    ["A","B","B","B","C","A","D","C","D","D","C","B","A","C","D","A"],
    ["A","B","B","C","D","A","A","D","A","B","C","B","C","D","D","C"],
    ["A","B","A","C","D","A","C","B","B","C","D","A","C","D","B","D"],
    ["A","A","B","A","C","B","A","D","D","C","D","B","C","D","C","B"],
    ["A","B","C","D","C","D","B","D","B","C","D","C","A","B","A","A"],
    ["A","B","C","B","D","C","B","D","A","D","C","C","A","A","D","B"],
    ["A","B","C","D","B","A","D","C","C","D","A","B","D","C","B","A"]
];

/*
Slashconfiguratie:
A = zwarte slash
B = grijze slash

Vakjes met dezelfde letter mogen niet dezelfde kleur hebben.
De indexen beginnen bij 0, van links naar rechts en van boven naar beneden.
*/
const slashes = [
    ["","","","","","","","","","","","","","","",""],
    ["","","B","","","","","","","B","","","","A","A",""],
    ["","","","","","","","","","","","","","","",""],
    ["","","","","","","","","","","","","","","",""],
    ["","","","","","","","","","","","","","","",""],
    ["","","","","A","","","","","","","","","","","A"],
    ["","","","","","","","","","","","A","","A","",""],
    ["A","","","","","","","","","","","","A","","",""],
    ["A","","","","","A","","","","","","","","","",""],
    ["A","","A","","B","B","","","","","","","","","",""],
    ["","","","","","","","","","","","","","","",""]
];

// Level 6 is 3 sterren waard.
const puzzleStars = [1, 3, 3, 2, 4, 4, 1, 3, 2, 2, 1];

const STORAGE_KEY = "forkedUpProgress_v1";

let currentPuzzle = 0;
let puzzleCompleted = false;
let captureMode = false;
let puzzleBeforeCapture = 0;
let progress;

function getDefaultProgress() {
    return { currentPuzzle: 0, puzzles: {}, spentCandies: 0, shop: { ownedThemes: [], ownedEffects: [], activeTheme: "default", activeEffects: [], activeEffect: "", customBackground: "", customPalette: null, customPaletteUnlocked: false, tileColorsUnlocked: false, emptyCellColor: "#fafafa", solvedCellColor: "#e8dcc5" } };
}

function loadProgress() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return getDefaultProgress();

        const parsed = JSON.parse(saved);
        if (!parsed || typeof parsed !== "object") return getDefaultProgress();

        if (!parsed.puzzles || typeof parsed.puzzles !== "object") {
            parsed.puzzles = {};
        }

        if (
            typeof parsed.currentPuzzle !== "number" ||
            parsed.currentPuzzle < 0 ||
            parsed.currentPuzzle >= puzzles.length
        ) {
            parsed.currentPuzzle = 0;
        }

        parsed.spentCandies = Number.isFinite(parsed.spentCandies) ? Math.max(0, parsed.spentCandies) : 0;
        parsed.shop = parsed.shop && typeof parsed.shop === "object" ? parsed.shop : {};
        parsed.shop.ownedThemes = Array.isArray(parsed.shop.ownedThemes) ? parsed.shop.ownedThemes : [];
        parsed.shop.ownedEffects = Array.isArray(parsed.shop.ownedEffects) ? parsed.shop.ownedEffects : [];
        parsed.shop.activeTheme = parsed.shop.activeTheme || "default";
        // Migrate older saves (single activeEffect) to stackable activeEffects.
        if (!Array.isArray(parsed.shop.activeEffects)) {
            parsed.shop.activeEffects = parsed.shop.activeEffect ? [parsed.shop.activeEffect] : [];
        }
        parsed.shop.activeEffects = [...new Set(parsed.shop.activeEffects.filter(id => typeof id === "string"))];
        parsed.shop.activeEffect = parsed.shop.activeEffects[0] || ""; // legacy compatibility
        parsed.shop.customBackground = parsed.shop.customBackground || "";
        parsed.shop.customPaletteUnlocked = parsed.shop.customPaletteUnlocked === true;
        parsed.shop.tileColorsUnlocked = parsed.shop.tileColorsUnlocked === true;
        parsed.shop.emptyCellColor = parsed.shop.emptyCellColor || "#fafafa";
        parsed.shop.solvedCellColor = parsed.shop.solvedCellColor || "#e8dcc5";
        return parsed;
    } catch (error) {
        console.warn("Could not load Forked Up progress.", error);
        return getDefaultProgress();
    }
}

const captureLoopStars = 5;

function getTotalStars() {
    const standardStars = puzzleStars.reduce((total, stars, index) => {

        return total + (puzzle && puzzle.completed ? stars : 0);
    }, 0);
    const capturePuzzle = progress.puzzles.captureLoops;
    return standardStars + (capturePuzzle && capturePuzzle.completed ? captureLoopStars : 0);
}

function getCandyBalance() {

function animateStarUnlock(previousTotal, newTotal, starsEarned) {
    const totalEl = totalStarsElement;
    if (!board || !totalEl || starsEarned <= 0) return;

    const boardRect = board.getBoundingClientRect();
    const targetRect = totalEl.getBoundingClientRect();

    const startX = boardRect.left + boardRect.width / 2;
    const startY = boardRect.top + boardRect.height / 2;
    const endX = targetRect.left + targetRect.width / 2;
    const endY = targetRect.top + targetRect.height / 2;

    const label = n => `🍬 ${n}`;
    totalEl.textContent = label(previousTotal);
    totalEl.classList.remove("total-stars-pop");

    for (let i = 0; i < starsEarned; i++) {
        const star = document.createElement("span");
        star.className = "star-fly";
        star.textContent = "🍬";

        const offset = (i - (starsEarned - 1) / 2) * 13;
        star.style.left = `${startX - 13 + offset}px`;
        star.style.top = `${startY - 13}px`;
        document.body.appendChild(star);

        if (typeof star.animate === "function") {
            const dx = endX - (startX + offset);
            const dy = endY - startY;

            const anim = star.animate([
                { transform: "translate(0,0) scale(1)", opacity: 1 },
                {
                    transform: `translate(${dx * .55}px,${dy * .55 - 35}px) scale(1.15)`,
                    opacity: 1,
                    offset: .65
                },
                {
                    transform: `translate(${dx}px,${dy}px) scale(.25)`,
                    opacity: 0
                }
            ], {
                duration: 850,
                delay: i * 110,
                easing: "cubic-bezier(.22,.75,.25,1)",
                fill: "forwards"
            });

            anim.onfinish = () => star.remove();
        } else {
            window.setTimeout(() => star.remove(), 1000 + i * 110);
        }
    }

    const duration = 900 + Math.max(0, starsEarned - 1) * 110;
    const started = performance.now();

    function countUp(now) {
        const amount = Math.min(1, (now - started) / duration);
        const eased = 1 - Math.pow(1 - amount, 3);

        totalEl.textContent = label(
            Math.round(previousTotal + (newTotal - previousTotal) * eased)
        );

        if (amount < 1) {
            requestAnimationFrame(countUp);
        } else {
            totalEl.textContent = label(newTotal);
            totalEl.classList.remove("total-stars-pop");
            void totalEl.offsetWidth;
            totalEl.classList.add("total-stars-pop");

            window.setTimeout(
                () => totalEl.classList.remove("total-stars-pop"),
                500
            );
        }
    }

    requestAnimationFrame(countUp);
}

function getCells() {

function getMarkerType(marker) {
    if (marker.classList.contains("cross")) return "cross";
    if (marker.classList.contains("filled")) return "closed";
    return "open";
}

function progressPuzzleKey() { return captureMode ? "captureLoops" : String(currentPuzzle); }

function getPuzzleProgress() {
    const saved = progress.puzzles[progressPuzzleKey()];

    if (!saved || typeof saved !== "object") {
        return {
            fills: Array(16).fill(null),
            markers: Array.from({ length: 16 }, () => []),
            arrows: [],
            placedPieces: Array(16).fill(null),
            completed: false
        };
    }

    return {
        fills: Array.isArray(saved.fills) ? saved.fills : Array(16).fill(null),
        markers: Array.isArray(saved.markers)
            ? saved.markers
            : Array.from({ length: 16 }, () => []),
        arrows: Array.isArray(saved.arrows) ? saved.arrows : [],
        placedPieces: Array.isArray(saved.placedPieces) ? saved.placedPieces : Array(16).fill(null),
        completed: saved.completed === true
    };
}

function saveCurrentPuzzle() {
    if (puzzleCompleted) {
        progress.puzzles[progressPuzzleKey()] = {
            fills: Array(16).fill(null),
            markers: Array.from({ length: 16 }, () => []),
            arrows: [],
            placedPieces: Array(16).fill(null),
            completed: true
        };
        saveProgress();
        return;
    }

    const cells = [...getCells()];
    const fills = cells.map(cell => cell.dataset.fillColor || null);

    const markers = cells.map(cell => {
        const markerContainer = cell.querySelector(".markers");

        return [...markerContainer.children].map(marker => ({
            type: getMarkerType(marker),
            color: marker.dataset.color || null
        }));
    });

    progress.puzzles[progressPuzzleKey()] = {
        fills,
        markers,
        arrows: arrows.map(arrow => ({ ...arrow })),
        placedPieces: cells.map(cell => cell.dataset.pieceType || null),
        completed: false
    };

    saveProgress();
}

function applySavedPuzzleState() {
    const saved = getPuzzleProgress();
    const cells = getCells();

    puzzleCompleted = saved.completed;
    arrows = Array.isArray(saved.arrows)
        ? saved.arrows.map(arrow => ({ ...arrow }))
        : [];

    cells.forEach((cell, index) => {
        const fillColor = saved.fills[index] || null;
        cell.dataset.fillColor = fillColor || "";

        cell.style.background =
            fillColor && colors[fillColor]
                ? colors[fillColor].fill
                : "var(--empty-cell, #fafafa)";

        cell.dataset.pieceType = "";
        const oldPlacedPiece = cell.querySelector(".placed-piece");
        if (oldPlacedPiece) oldPlacedPiece.remove();
        const placedType = captureMode ? (saved.placedPieces[index] || null) : null;
        if (placedType && pieces[placedType]) {
            const placedImg = document.createElement("img");
            placedImg.className = "piece placed-piece";
            placedImg.src = pieces[placedType];
            placedImg.alt = ({A:"Knight",B:"Bishop",C:"Rook",D:"Pawn"})[placedType];
            cell.insertBefore(placedImg, cell.querySelector(".markers"));
            cell.dataset.pieceType = placedType;
        }

        const markers = cell.querySelector(".markers");
        markers.innerHTML = "";

        const savedMarkers = Array.isArray(saved.markers[index])
            ? saved.markers[index]
            : [];

        savedMarkers.forEach(savedMarker => {
            if (!savedMarker || !colors[savedMarker.color]) return;

            const marker = document.createElement("div");
            marker.classList.add("marker");

            if (savedMarker.type === "closed") {
                marker.classList.add("filled");
            }

            if (savedMarker.type === "cross") {
                marker.classList.add("cross");
            }

            marker.style.color = colors[savedMarker.color].line;
            marker.dataset.color = savedMarker.color;
            markers.appendChild(marker);
        });
    });

    if (puzzleCompleted) {
        completePuzzle(false);
        getCells().forEach(cell => {
            cell.style.background =
                progress.shop.tileColorsUnlocked
                    ? progress.shop.solvedCellColor
                    : "var(--solved-cell, #e8dcc5)";
        });
    } else {
        unlockPuzzle();
    }

    renderArrows();
    updateCaptureCounts();
}

/* SLASH RULES
   The same letter in a level's slash array links those cells.
   Cells in the same group may not have the same fill color.
*/

function getSlashType(index) {
    if (captureMode) return "";
    const levelSlashes = slashes[currentPuzzle] || [];
    return levelSlashes[index] || null;
}

function getSlashGroup(index) {
    const group = getSlashType(index);
    if (!group) return [];

    const levelSlashes = slashes[currentPuzzle] || [];

    return levelSlashes
        .map((slash, cellIndex) => slash === group ? cellIndex : -1)
        .filter(cellIndex => cellIndex !== -1);
}

function getCellColor(cell) {
    return cell.dataset.fillColor || null;
}

function hasSlashColorConflict(cellIndex, color) {
    const group = getSlashGroup(cellIndex);
    if (group.length === 0) return false;

    const cells = [...getCells()];

    return group.some(otherIndex => {
        if (otherIndex === cellIndex) return false;
        return getCellColor(cells[otherIndex]) === color;
    });
}

function checkSlashRules(cells) {
    const levelSlashes = slashes[currentPuzzle] || [];

    for (let i = 0; i < levelSlashes.length; i++) {
        const group = levelSlashes[i];
        if (!group) continue;

        for (let j = i + 1; j < levelSlashes.length; j++) {
            if (levelSlashes[j] !== group) continue;

            const colorA = getCellColor(cells[i]);
            const colorB = getCellColor(cells[j]);

            if (colorA && colorB && colorA === colorB) {
                resultMessage.textContent =
                    ``;
                return false;
            }
        }
    }

    return true;
}

const captureLoops = [
    ["A2", "A3", "C1", "C3", "A2"],
    ["B1", "C2", "B4", "A3", "B1"],
    ["A2", "D2", "C3", "B2", "A2"],
    ["B2", "B4", "D3", "B3", "B2"],
    ["B4", "D4", "D1", "C2", "B4"]
];
function coordinatePoint(coord) {
    const col = coord.charCodeAt(0) - 65;
    const row = Number(coord[1]) - 1;
    return { x: (col + .5) * 25, y: (row + .5) * 25 };
}
function renderCaptureLoops() {
    const host = document.getElementById("loopCards");
    host.innerHTML = "";
    captureLoops.forEach((loop, loopIndex) => {
        const card = document.createElement("section");
        card.className = "loop-card";
        const heading = document.createElement("h3");
        heading.textContent = `Possible loop ${loopIndex + 1}`;
        card.appendChild(heading);
        const grid = document.createElement("div");
        grid.className = "loop-grid";
        for (let row = 1; row <= 4; row++) {
            for (let col = 0; col < 4; col++) {
                const cell = document.createElement("div");
                cell.className = "loop-cell";
                cell.textContent = String.fromCharCode(65 + col) + row;
                grid.appendChild(cell);
            }
        }
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "loop-lines");
        svg.setAttribute("viewBox", "0 0 100 100");
        loop.slice(0, -1).forEach((coord, i) => {
            const a = coordinatePoint(coord), b = coordinatePoint(loop[i + 1]);
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", a.x); line.setAttribute("y1", a.y);
            line.setAttribute("x2", b.x); line.setAttribute("y2", b.y);
            svg.appendChild(line);
        });
        grid.appendChild(svg);
        card.appendChild(grid);
        const desc = document.createElement("p");
        desc.textContent = loop.join("  ·  ");
        card.appendChild(desc);
        host.appendChild(card);
    });
}
function setGameMode(useCaptureMode) {

    if (captureMode) {

const capturePieceTotals = { C: 7, A: 4, B: 3, D: 2 };
function updateCaptureCounts() {
    const placed = [...getCells()].map(cell => cell.dataset.pieceType || null);
    document.querySelectorAll(".capture-count").forEach(button => {
        const type = button.dataset.piece;
        const remaining = capturePieceTotals[type] - placed.filter(piece => piece === type).length;
        button.querySelector("b").textContent = String(remaining);
        button.classList.toggle("selected", captureMode && selectedTool === `piece-${type}`);
        button.setAttribute("aria-pressed", String(captureMode && selectedTool === `piece-${type}`));

}

    selectedTool = selectedTool === `piece-${type}` ? "filled" : `piece-${type}`;
    document.querySelectorAll(".tool-button").forEach(button => button.classList.toggle("selected", button.dataset.tool === selectedTool));

function setupCellEvents() {
    getCells().forEach(cell => {
        cell.addEventListener("click", () => {
            if (puzzleCompleted) return;

            if (cell.dataset.skipClick === "true") {
                cell.dataset.skipClick = "false";
                return;
            }

            const color = colors[selectedColor];

            if (captureMode && selectedTool.startsWith("piece-")) {
                const selectedType = selectedTool.slice(6);
                const existingType = cell.dataset.pieceType || "";
                if (existingType === selectedType) {
                    cell.querySelector(".placed-piece")?.remove();
                    cell.dataset.pieceType = "";
                } else {
                    let img = cell.querySelector(".placed-piece");
                    if (!img) {
                        img = document.createElement("img");
                        img.className = "piece placed-piece";
                        cell.insertBefore(img, cell.querySelector(".markers"));
                    }
                    img.src = pieces[selectedType];
                    img.alt = ({A:"Knight",B:"Bishop",C:"Rook",D:"Pawn"})[selectedType];
                    cell.dataset.pieceType = selectedType;
                }
                resultMessage.textContent = "";
                updateCaptureCounts();
                saveCurrentPuzzle();
                return;
            }

            if (selectedTool === "filled") {
                const cellIndex = Number(cell.dataset.index);

                // Prevent filling a linked cell with the same color.
                if (
                    cell.dataset.fillColor !== selectedColor &&
                    hasSlashColorConflict(cellIndex, selectedColor)
                ) {
                    const group = getSlashType(cellIndex);
                    resultMessage.textContent =
                        `Vakjes met slash ${group} mogen niet dezelfde kleur hebben.`;
                    return;
                }

                if (cell.dataset.fillColor === selectedColor) {
                    cell.style.background = "var(--empty-cell, #fafafa)";
                    cell.dataset.fillColor = "";
                } else {
                    cell.style.background = color.fill;
                    cell.dataset.fillColor = selectedColor;
                }

                resultMessage.textContent = "";
                saveCurrentPuzzle();
                return;
            }

            const markers = cell.querySelector(".markers");
            const marker = document.createElement("div");

            marker.classList.add("marker");
            marker.style.color = color.line;
            marker.dataset.color = selectedColor;

            if (selectedTool === "open") marker.classList.add("open");
            if (selectedTool === "closed") marker.classList.add("filled");
            if (selectedTool === "cross") marker.classList.add("cross");

            const markerType = selectedTool;

            const existing = [...markers.children].find(existingMarker => {
                return (
                    getMarkerType(existingMarker) === markerType &&
                    existingMarker.dataset.color === selectedColor
                );
            });

            if (existing) {
                existing.remove();
            } else {
                markers.appendChild(marker);
            }

            saveCurrentPuzzle();
        });

        cell.addEventListener("mousedown", event => {
            if (puzzleCompleted || event.button !== 0 || (captureMode && selectedTool.startsWith("piece-"))) return;

            dragging = true;
            dragStart = Number(cell.dataset.index);
            dragCurrent = dragStart;
            drawTemporaryArrow();
        });
    });
}

/* ARROWS */

document.addEventListener("mousemove", event => {
    if (puzzleCompleted || !dragging) return;

    const target = document.elementFromPoint(event.clientX, event.clientY);
    if (!target) return;

    const cell = target.closest(".cell");
    if (!cell) return;

    dragCurrent = Number(cell.dataset.index);
    drawTemporaryArrow();
});

document.addEventListener("mouseup", event => {
    if (!dragging) return;

    if (puzzleCompleted) {
        dragging = false;
        return;
    }

    dragging = false;

    const target = document.elementFromPoint(event.clientX, event.clientY);
    clearTemporaryArrow();

    if (!target) return;

    const cell = target.closest(".cell");
    if (!cell) return;

    const end = Number(cell.dataset.index);
    if (dragStart === end) return;

    toggleArrow(dragStart, end);
    cell.dataset.skipClick = "true";
});

function toggleArrow(from, to) {
    const existingIndex = arrows.findIndex(arrow =>
        arrow.from === from &&
        arrow.to === to &&
        arrow.color === selectedColor
    );

    if (existingIndex !== -1) {
        arrows.splice(existingIndex, 1);
    } else {
        arrows.push({ from, to, color: selectedColor });
    }

    renderArrows();
    saveCurrentPuzzle();
}

function getCellCenter(index) {
    const cells = getCells();
    const cell = cells[index];

    if (!cell) return { x: 0, y: 0 };

    const boardRect = board.getBoundingClientRect();
    const cellRect = cell.getBoundingClientRect();

    return {
        x: cellRect.left - boardRect.left + cellRect.width / 2,
        y: cellRect.top - boardRect.top + cellRect.height / 2
    };
}

function pointOnCircle(center, target, radius) {
    const dx = target.x - center.x;
    const dy = target.y - center.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance === 0) return center;

    return {
        x: center.x + (dx / distance) * radius,
        y: center.y + (dy / distance) * radius
    };
}

function getArrowOffset(arrow) {
    // Offset arrows sharing the same line, including partially overlapping segments.
    const a = getCellCenter(arrow.from), b = getCellCenter(arrow.to);
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const group = arrows.filter(other => {
        const c = getCellCenter(other.from), d = getCellCenter(other.to);
        const ox = d.x - c.x, oy = d.y - c.y, olen = Math.hypot(ox, oy) || 1;
        const parallel = Math.abs(ux * (oy / olen) - uy * (ox / olen)) < 0.025;
        const lineDistance = Math.abs((c.x - a.x) * uy - (c.y - a.y) * ux);
        return parallel && lineDistance < 5;
    });
    const index = group.indexOf(arrow), count = group.length;
    return count <= 1 ? 0 : (index - (count - 1) / 2) * 9;
}

function renderArrows() {
    arrowLayer.innerHTML = "";

    arrows.forEach(arrow => {
        if (!colors[arrow.color]) return;

        drawArrow(
            arrow.from,
            arrow.to,
            colors[arrow.color].line,
            getArrowOffset(arrow)
        );
    });
}

function drawArrow(fromIndex, toIndex, color, offset = 0) {
    const startCenter = getCellCenter(fromIndex);
    const endCenter = getCellCenter(toIndex);

    const dx = endCenter.x - startCenter.x;
    const dy = endCenter.y - startCenter.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance === 0) return;

    const ux = dx / distance;
    const uy = dy / distance;
    const px = -uy;
    const py = ux;

    const shiftedStart = {
        x: startCenter.x + px * offset,
        y: startCenter.y + py * offset
    };

    const shiftedEnd = {
        x: endCenter.x + px * offset,
        y: endCenter.y + py * offset
    };

    const radius = 23;
    const start = pointOnCircle(shiftedStart, shiftedEnd, radius);
    const end = pointOnCircle(shiftedEnd, shiftedStart, radius);

    const arrowDX = end.x - start.x;
    const arrowDY = end.y - start.y;
    const arrowLength = Math.sqrt(arrowDX * arrowDX + arrowDY * arrowDY);

    if (arrowLength === 0) return;

    const arrowUX = arrowDX / arrowLength;
    const arrowUY = arrowDY / arrowLength;

    const headLength = 9;
    const headWidth = 5;

    const lineEnd = {
        x: end.x - arrowUX * headLength,
        y: end.y - arrowUY * headLength
    };

    const left = {
        x: lineEnd.x - arrowUX * headWidth - arrowUY * headWidth,
        y: lineEnd.y - arrowUY * headWidth + arrowUX * headWidth
    };

    const right = {
        x: lineEnd.x - arrowUX * headWidth + arrowUY * headWidth,
        y: lineEnd.y - arrowUY * headWidth - arrowUX * headWidth
    };

    const line = document.createElementNS(
        "http://www.w3.org/2000/svg", "line"
    );

    line.setAttribute("x1", start.x);
    line.setAttribute("y1", start.y);
    line.setAttribute("x2", lineEnd.x);
    line.setAttribute("y2", lineEnd.y);
    line.setAttribute("stroke", color);
    line.classList.add("arrow");

    const polygon = document.createElementNS(
        "http://www.w3.org/2000/svg", "polygon"
    );

    polygon.setAttribute(
        "points",
        `${end.x},${end.y} ${left.x},${left.y} ${right.x},${right.y}`
    );
    polygon.setAttribute("fill", color);

    arrowLayer.appendChild(line);
    arrowLayer.appendChild(polygon);
}

function drawTemporaryArrow() {
    clearTemporaryArrow();

    if (
        dragStart === null ||
        dragCurrent === null ||

/* ANSWER CHECKING */

function allCellsColored() {
    return [...getCells()].every(cell => Boolean(cell.dataset.fillColor));
}

function arraysEqual(a, b) {
    if (a.length !== b.length) return false;
    return a.every((value, index) => value === b[index]);
}

function checkAnswer() {
    if (puzzleCompleted) return;

    if (!allCellsColored()) {
        resultMessage.textContent = "Color all 16 squares before submitting.";
        return;
    }

    const cells = [...getCells()];

    // Check all slash-linked cells before checking the answer groups.
    if (!checkSlashRules(cells)) return;

    const playerColors = ["green", "blue", "yellow", "orange"];
    const usedAnswerGroups = new Set();
    let correct = true;

    for (const color of playerColors) {
        const playerCells = cells
            .map((cell, index) =>
                getCellColor(cell) === color ? index : -1
            )
            .filter(index => index !== -1);

        if (playerCells.length !== 4) {
            correct = false;
            break;
        }

        let matchingGroup = -1;

        for (let group = 0; group < 4; group++) {
            if (usedAnswerGroups.has(group)) continue;

            const answerCells = answers[currentPuzzle]
                .map((letter, index) =>
                    letter === String.fromCharCode(65 + group) ? index : -1
                )
                .filter(index => index !== -1);

            if (arraysEqual(playerCells, answerCells)) {
                matchingGroup = group;
                break;
            }
        }

        if (matchingGroup === -1) {
            correct = false;
            break;
        }

        usedAnswerGroups.add(matchingGroup);
    }

    if (correct) {
        completePuzzle(true);
    } else {
        showIncorrect();
    }
}

function showIncorrect() {
    resultMessage.textContent = "Not quite — try again!";
    saveCurrentPuzzle();
}

function launchConfetti() {
    const canvas = document.getElementById("confettiCanvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;

    const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    const resize = () => {
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();

    const colors = ["#ff595e", "#ffca3a", "#8ac926", "#1982c4", "#6a4c93", "#ff70a6", "#00c2a8"];
    const count = 170;
    const particles = Array.from({ length: count }, () => {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2.5 + Math.random() * 8;
        return {
            x: window.innerWidth * (0.2 + Math.random() * 0.6),
            y: window.innerHeight * (0.12 + Math.random() * 0.28),
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - (2 + Math.random() * 4),
            gravity: 0.09 + Math.random() * 0.12,
            size: 3 + Math.random() * 6,
            rotation: Math.random() * Math.PI * 2,
            spin: (Math.random() - 0.5) * 0.25,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 90 + Math.random() * 55
        };
    });

    let frame = 0;
    function animate() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        let alive = false;
        for (const p of particles) {
            if (frame > p.life) continue;
            alive = true;
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.992;
            p.rotation += p.spin;

            const alpha = Math.max(0, 1 - frame / p.life);
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rotation);
            ctx.fillRect(-p.size / 2, -p.size * 0.35, p.size, p.size * 0.7);
            ctx.restore();
        }
        ctx.globalAlpha = 1;
        frame++;
        if (alive && frame < 170) {
            requestAnimationFrame(animate);
        } else {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        }
    }
    requestAnimationFrame(animate);
}

window.addEventListener("resize", () => {
    const canvas = document.getElementById("confettiCanvas");
    if (canvas) {
        canvas.width = Math.floor(window.innerWidth * Math.max(1, Math.min(2, window.devicePixelRatio || 1)));
        canvas.height = Math.floor(window.innerHeight * Math.max(1, Math.min(2, window.devicePixelRatio || 1)));
    }
});

function completePuzzle(save = true) {
    const previousTotal = getCandyBalance();
    const starsEarned = captureMode ? captureLoopStars : (puzzleStars[currentPuzzle] || 0);

    puzzleCompleted = true;
    dragging = false;
    dragStart = null;
    dragCurrent = null;

    arrows = [];
    renderArrows();

    getCells().forEach(cell => {
        cell.querySelector(".markers").innerHTML = "";
        cell.style.background = progress.shop.tileColorsUnlocked
            ? progress.shop.solvedCellColor
            : "var(--solved-cell, #e8dcc5)";
        cell.dataset.fillColor = "";
    });

    board.classList.add("locked");

    document.querySelectorAll(".color-button, .tool-button").forEach(button => {
        button.disabled = true;
    });

    submitPuzzleButton.disabled = true;
    resultMessage.textContent = "Puzzle complete!";

    if (save) {
        progress.puzzles[progressPuzzleKey()] = {
            fills: Array(16).fill(null),
            markers: Array.from({ length: 16 }, () => []),
            arrows: [],
            placedPieces: Array(16).fill(null),
            completed: true
        };

        saveProgress();
    }

    updateStarDisplay();

    if (save) {
        animateStarUnlock(previousTotal, getCandyBalance(), starsEarned);
        if (progress.shop && (progress.shop.activeEffects || [progress.shop.activeEffect]).includes("confetti")) {
            launchConfetti();
        }
    }
}

function unlockPuzzle() {
    puzzleCompleted = false;
    board.classList.remove("locked");

    document.querySelectorAll(".color-button, .tool-button").forEach(button => {
        button.disabled = false;
    });

    submitPuzzleButton.disabled = false;
}

document.getElementById("nextPuzzle").addEventListener("click", () => {
    if (captureMode) return;
    if (currentPuzzle < puzzles.length - 1) {
        saveCurrentPuzzle();

        currentPuzzle++;
        progress.currentPuzzle = currentPuzzle;
        saveProgress();

        prepareNewPuzzle();
    } else {
        endMessage.style.display = "block";
        progress.currentPuzzle = currentPuzzle;
        saveProgress();
    }
});

document.getElementById("previousPuzzle").addEventListener("click", () => {
    if (captureMode) return;
    if (currentPuzzle === 0) return;

    saveCurrentPuzzle();

    currentPuzzle--;
    progress.currentPuzzle = currentPuzzle;
    saveProgress();

    prepareNewPuzzle();
});

submitPuzzleButton.addEventListener("click", checkAnswer);


/* BISSHOP: cosmetics */
const shopCatalog = {
  themes: [
    { id:"default", name:"Standard", price:0, preview:"#ffffff", palette:{green:{fill:"#bfe3c4",line:"#18743a"},blue:{fill:"#c5dcfa",line:"#245bb5"},yellow:{fill:"#f7e7a3",line:"#a57a00"},orange:{fill:"#f3c2c2",line:"#c62828"}} },
    { id:"ocean", name:"Ocean Stripes", price:4, preview:"repeating-linear-gradient(135deg,#e9f9fb 0 10px,#bfe7ed 10px 20px)", palette:{green:{fill:"#b9e2cb",line:"#155d3a"},blue:{fill:"#b7e3f0",line:"#075c7c"},yellow:{fill:"#d9cdf6",line:"#593795"},orange:{fill:"#f5c7e0",line:"#9d2869"}} },
    { id:"sunset", name:"Sunset Stripes", price:4, preview:"repeating-linear-gradient(135deg,#fff0e5 0 10px,#f7c7b6 10px 20px)", palette:{green:{fill:"#f5b5b0",line:"#c62828"},blue:{fill:"#bcd9f7",line:"#245bb5"},yellow:{fill:"#ffec9e",line:"#ad7b00"},orange:{fill:"#ffd0a6",line:"#d96b12"}} },
    { id:"forest", name:"Forest Stripes", price:4, preview:"repeating-linear-gradient(135deg,#edf5e9 0 10px,#cfe2c7 10px 20px)", palette:{green:{fill:"#bfe3c4",line:"#237a3b"},blue:{fill:"#bfdcf7",line:"#2465b4"},yellow:{fill:"#d8c7f3",line:"#6639a6"},orange:{fill:"#f5c7e2",line:"#b62b79"}} },
    { id:"lavender", name:"Lavender Stripes", price:4, preview:"repeating-linear-gradient(135deg,#f5efff 0 10px,#dfd0f7 10px 20px)", palette:{green:{fill:"#c8e8d2",line:"#276746"},blue:{fill:"#c5dafa",line:"#2856a4"},yellow:{fill:"#dfc9f4",line:"#7040a2"},orange:{fill:"#f5c9e2",line:"#a92e70"}} }
  ],
  effects: [
    { id:"pulse", name:"Pulse Tiles", price:4, preview:"radial-gradient(circle,#ffffff,#dce3f5)" },
    { id:"confetti", name:"Confetti", price:4, preview:"linear-gradient(135deg,#ff6b6b 0 16%,#ffd93d 16% 32%,#6bcb77 32% 48%,#4d96ff 48% 64%,#b983ff 64% 80%,#ff8fab 80%)" }
  ]
};
const defaultPalette = shopCatalog.themes[0].palette;

function applyShopAppearance() {
  const shop = progress.shop;
  document.body.classList.remove("theme-default","theme-ocean","theme-sunset","theme-forest","theme-lavender","theme-custom","pulse-tiles");
  const theme = shop.activeTheme || "default";
  document.body.classList.add("theme-" + (theme === "custom" ? "custom" : theme));
  if (theme === "custom" && shop.customBackground) {
    document.body.style.backgroundImage = `url("${shop.customBackground}")`;
  } else {
    document.body.style.backgroundImage = "";
  }
  const selected = shopCatalog.themes.find(item => item.id === theme);
  colors = (theme === "custom" && shop.customPaletteUnlocked && shop.customPalette)
    ? shop.customPalette : (selected ? selected.palette : defaultPalette);
  document.documentElement.style.setProperty("--empty-cell", shop.tileColorsUnlocked ? shop.emptyCellColor : "#fafafa");
  document.documentElement.style.setProperty("--solved-cell", shop.tileColorsUnlocked ? shop.solvedCellColor : "#e8dcc5");
  document.querySelectorAll(".color-button").forEach(button => {
    const c = colors[button.dataset.color];
    if (c) {
      button.style.background = c.fill;
      button.style.borderColor = button.classList.contains("selected") ? c.line : "transparent";
    }
  });
  const activeEffects = Array.isArray(shop.activeEffects) ? shop.activeEffects : (shop.activeEffect ? [shop.activeEffect] : []);
  document.body.classList.toggle("pulse-tiles", activeEffects.includes("pulse"));
  // Repaint annotations saved on the current board with the active theme's palette.
  getCells().forEach(cell => {
    const fill = cell.dataset.fillColor;
    if (fill && colors[fill]) cell.style.background = colors[fill].fill;
    cell.querySelectorAll(".marker").forEach(marker => {
      const key = marker.dataset.color;
      if (key && colors[key]) marker.style.color = colors[key].line;
    });
  });
  renderArrows();
}

function renderShop() {
  updateStarDisplay();
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";
  const activeTab = document.querySelector(".shop-tab.active")?.dataset.shopTab || "themes";
  if (activeTab === "custom") { renderCustomShop(grid); return; }
  const items = activeTab === "effects" ? shopCatalog.effects : shopCatalog.themes;
  items.forEach(item => {
    const isTheme = shopCatalog.themes.some(theme => theme.id === item.id);
    const ownedList = isTheme ? progress.shop.ownedThemes : progress.shop.ownedEffects;
    const owned = item.id === "default" || ownedList.includes(item.id);
    const activeEffects = Array.isArray(progress.shop.activeEffects) ? progress.shop.activeEffects : (progress.shop.activeEffect ? [progress.shop.activeEffect] : []);
    const active = isTheme ? progress.shop.activeTheme === item.id : activeEffects.includes(item.id);
    const card = document.createElement("div");
    card.className = "shop-item";
    card.innerHTML = `<div class="shop-preview" style="background:${item.preview}"></div><h3>${item.name}</h3>`;
    const button = document.createElement("button");
    button.className = "shop-buy";
    button.textContent = active ? (isTheme ? "Active ✓" : "Unequip") : owned ? "Equip" : `${item.price} 🍬`;
    // Effects can be toggled off again; themes stay equipped until another theme is selected.
    button.disabled = (active && isTheme) || (!active && !owned && getCandyBalance() < item.price);
    button.onclick = () => {
      if (!isTheme && active) {
        const activeEffects = Array.isArray(progress.shop.activeEffects) ? progress.shop.activeEffects : (progress.shop.activeEffect ? [progress.shop.activeEffect] : []);
        progress.shop.activeEffects = activeEffects.filter(id => id !== item.id);
      } else {
        if (!owned) {
          if (getCandyBalance() < item.price) return;
          progress.spentCandies = (progress.spentCandies || 0) + item.price;
          ownedList.push(item.id);
        }
        if (isTheme) {
          progress.shop.activeTheme = item.id;
        } else {
          const activeEffects = Array.isArray(progress.shop.activeEffects) ? progress.shop.activeEffects : (progress.shop.activeEffect ? [progress.shop.activeEffect] : []);
          if (!activeEffects.includes(item.id)) activeEffects.push(item.id);
          progress.shop.activeEffects = activeEffects;
        }
      }
      progress.shop.activeEffect = (progress.shop.activeEffects || [])[0] || ""; // legacy compatibility
      saveProgress();
      applyShopAppearance();
      renderShop();
    };
    card.appendChild(button);
    grid.appendChild(card);
  });
  if (activeTab !== "themes") return;
  const backgroundCard = document.createElement("div");
  backgroundCard.className = "shop-item";
  backgroundCard.innerHTML = `<div class="shop-preview" style="background:linear-gradient(135deg,#f7d7ec,#d4e7ff)"></div><h3>Custom Image</h3>`;
  const uploadButton = document.createElement("button");
  uploadButton.className = "shop-buy";
  const hasBackground = Boolean(progress.shop.customBackground);
  uploadButton.textContent = hasBackground ? "Afbeelding wijzigen" : "8 🍬";
  uploadButton.disabled = !hasBackground && getCandyBalance() < 8;
  uploadButton.onclick = () => document.getElementById("backgroundUpload").click();
  backgroundCard.appendChild(uploadButton);
  grid.appendChild(backgroundCard);
}

function renderCustomShop(grid) {
  const shop = progress.shop;
  const paletteCard = document.createElement("div");
  paletteCard.className = "shop-item"; paletteCard.style.gridColumn = "1 / -1";
  paletteCard.innerHTML = `<h3>Custom Colors</h3><p></p>`;

  const paletteBuy = document.createElement("button");
  paletteBuy.className = "shop-buy";

  const customColorsActive =
      shop.activeTheme === "custom" &&
      shop.customPaletteUnlocked;

  paletteBuy.textContent = customColorsActive
      ? "Unequip"
      : shop.customPaletteUnlocked
          ? "Equip"
          : "4 🍬";

  paletteBuy.disabled =
      !shop.customPaletteUnlocked &&
      getCandyBalance() < 4;

  paletteBuy.onclick = () => {
      if (!shop.customPaletteUnlocked) {
          if (getCandyBalance() < 4) return;

          progress.spentCandies += 4;
          shop.customPaletteUnlocked = true;
          shop.customPalette = JSON.parse(
              JSON.stringify(defaultPalette)
          );
          shop.activeTheme = "custom";
      } else if (shop.activeTheme === "custom") {
          // Schakel custom kleuren uit en ga terug naar Standard.
          shop.activeTheme = "default";
      } else {
          // Activeer de eerder gekochte custom kleuren opnieuw.
          shop.activeTheme = "custom";
      }

      saveProgress();
      applyShopAppearance();
      renderShop();
  };
  
  paletteCard.appendChild(paletteBuy);
  if (shop.customPaletteUnlocked) {
    shop.customPalette ||= JSON.parse(JSON.stringify(defaultPalette));
    const controls = document.createElement("div"); controls.className = "custom-colors";
    Object.entries({green:"Color 1",blue:"Color 2",yellow:"Color 3",orange:"Color 4"}).forEach(([key,label]) => {
      const row = document.createElement("div"); row.className = "custom-color-row";
      row.innerHTML = `<strong>${label}</strong>`;
      ["fill","line"].forEach(kind => {
        const input = document.createElement("input"); input.type = "color";
        input.title = kind === "fill" ? `${label}: vakjes` : `${label}: pijlen en markeringen`;
        input.value = shop.customPalette[key][kind];
        input.addEventListener("input", () => {
          shop.customPalette[key][kind] = input.value; shop.activeTheme = "custom";
          saveProgress(); applyShopAppearance();
        });
        row.appendChild(input);
      });
      controls.appendChild(row);
    });
    paletteCard.appendChild(controls);
    const note = document.createElement("p"); note.textContent = "";
    paletteCard.appendChild(note);
  }
  grid.appendChild(paletteCard);

  const tileCard = document.createElement("div"); tileCard.className = "shop-item"; tileCard.style.gridColumn = "1 / -1";
  tileCard.innerHTML = `<h3>Empty/Filled Tiles Colors</h3><p></p>`;
  const tileBuy = document.createElement("button"); tileBuy.className = "shop-buy";
  tileBuy.textContent = shop.tileColorsUnlocked ? "Purchased ✓" : "2 🍬";
  tileBuy.disabled = shop.tileColorsUnlocked || getCandyBalance() < 2;
  tileBuy.onclick = () => {
    if (shop.tileColorsUnlocked || getCandyBalance() < 2) return;
    progress.spentCandies += 2; shop.tileColorsUnlocked = true;
    saveProgress(); applyShopAppearance(); renderShop();
  };
  tileCard.appendChild(tileBuy);
  if (shop.tileColorsUnlocked) {
    [["Empty","emptyCellColor"],["Solved","solvedCellColor"]].forEach(([label,key]) => {
      const row = document.createElement("div"); row.className = "custom-color-row"; row.style.marginTop = "10px";
      row.innerHTML = `<strong>${label}</strong>`;
      const input = document.createElement("input"); input.type = "color"; input.value = shop[key];
      input.addEventListener("input", () => {
          shop[key] = input.value;
          saveProgress();
          applyShopAppearance();

          getCells().forEach(cell => {
              if (puzzleCompleted) {
                  cell.style.background = shop.tileColorsUnlocked
                      ? shop.solvedCellColor
                      : "var(--solved-cell, #e8dcc5)";
              } else if (!cell.dataset.fillColor) {
                  cell.style.background = shop.tileColorsUnlocked
                      ? shop.emptyCellColor
                      : "var(--empty-cell, #fafafa)";
              }
          });
      });
      row.appendChild(input); tileCard.appendChild(row);
    });
  }
  grid.appendChild(tileCard);

  const bgCard = document.createElement("div"); bgCard.className = "shop-item";
  bgCard.innerHTML = `<div class="shop-preview" style="background:linear-gradient(135deg,#f7d7ec,#d4e7ff)"></div><h3>Custom Image</h3><p></p>`;
  const upload = document.createElement("button"); upload.className = "shop-buy";
  upload.textContent = shop.customBackground ? "Afbeelding wijzigen" : "8 🍬";
  upload.disabled = !shop.customBackground && getCandyBalance() < 8;
  upload.onclick = () => document.getElementById("backgroundUpload").click();
  bgCard.appendChild(upload); grid.appendChild(bgCard);
}

document.querySelectorAll(".shop-tab").forEach(tab => tab.addEventListener("click", () => {
  document.querySelectorAll(".shop-tab").forEach(other => other.classList.toggle("active", other === tab));
  renderShop();
}));

document.getElementById("shopButton").addEventListener("click", () => {
  document.getElementById("shopOverlay").classList.add("open");
  renderShop();
});
document.getElementById("shopClose").addEventListener("click", () => document.getElementById("shopOverlay").classList.remove("open"));
document.getElementById("shopOverlay").addEventListener("click", event => {
  if (event.target.id === "shopOverlay") event.currentTarget.classList.remove("open");
});
document.getElementById("backgroundUpload").addEventListener("change", event => {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) { alert("Kies een afbeeldingsbestand."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      // Resize large uploads to keep local storage manageable.
      const canvas = document.createElement("canvas");
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL("image/jpeg", .82);
      if (!progress.shop.customBackground) progress.spentCandies = (progress.spentCandies || 0) + 8;
      progress.shop.customBackground = dataUrl;
      progress.shop.activeTheme = "custom";
      saveProgress();
      applyShopAppearance();
      renderShop();
    };
    img.onerror = () => alert("This Image coudn't be opened.");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
  event.target.value = "";
});
